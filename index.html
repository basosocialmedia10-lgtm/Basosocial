<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باسۆ | پەڕەی لینکەکان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        :root {
            --primary: #6B4F3D; /* مۆری ناوەند */
            --secondary: #8B6B4F; /* مۆری ڕووناکتر */
            --dark-brown: #4A3428; /* مۆری تۆخ */
            --light-brown: #A78B6F; /* مۆری زەرد */
            --cream: #D4B996; /* پەمەیی */
            --dark: #2C241D;
            --light: #F5F1EB;
            --gradient: linear-gradient(135deg, var(--primary), var(--dark-brown));
        }
        
        body, html {
            height: 100%;
            overflow: auto; /* لێ بدە جوڵا بێت */
        }
        
        body {
            background: 
                linear-gradient(45deg, var(--dark-brown) 0%, var(--primary) 50%, var(--light-brown) 100%),
                radial-gradient(circle at 20% 80%, var(--cream) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, var(--light-brown) 0%, transparent 40%);
            background-blend-mode: overlay, screen, normal;
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: var(--dark);
            position: relative;
            display: block;
            min-height: 100vh;
            padding: 20px;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* کاریگەری پەمەیی تەنکی */
        .cream-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
        }
        
        .particle {
            position: absolute;
            background-color: var(--cream);
            border-radius: 50%;
            opacity: 0.6;
            animation: floatParticle linear infinite;
        }
        
        @keyframes floatParticle {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
            margin: auto;
        }
        
        .profile-card {
            background-color: rgba(255, 248, 240, 0.92);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 
                0 20px 50px rgba(107, 79, 61, 0.3),
                0 10px 30px rgba(139, 107, 79, 0.2),
                inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            text-align: center;
            border: 1px solid rgba(212, 185, 150, 0.5);
            margin-bottom: 20px;
            position: relative;
            overflow: visible; /* گۆڕین بۆ visible */
        }
        
        .profile-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--cream), var(--light-brown), var(--primary));
            border-radius: 32px;
            z-index: -1;
            opacity: 0.4;
            filter: blur(8px);
        }
        
        .profile-header {
            position: relative;
            margin-bottom: 25px;
        }
        
        .profile-pic-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
            background: linear-gradient(135deg, var(--primary), var(--light-brown), var(--cream));
            padding: 5px;
            box-shadow: 
                0 0 30px rgba(107, 79, 61, 0.5),
                0 0 60px rgba(139, 107, 79, 0.3),
                inset 0 0 20px rgba(255, 248, 240, 0.5);
            animation: pulse-cream 4s infinite alternate;
        }
        
        @keyframes pulse-cream {
            0% { 
                box-shadow: 
                    0 0 20px rgba(107, 79, 61, 0.3),
                    0 0 40px rgba(139, 107, 79, 0.2);
            }
            100% { 
                box-shadow: 
                    0 0 40px rgba(212, 185, 150, 0.5),
                    0 0 80px rgba(167, 139, 111, 0.3);
            }
        }
        
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #FFF8F0, #F5F1EB);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: var(--primary);
            overflow: hidden;
            border: 2px solid rgba(212, 185, 150, 0.3);
        }
        
        .profile-name {
            font-size: 32px;
            margin-bottom: 8px;
            color: var(--dark-brown);
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 4px rgba(139, 107, 79, 0.1);
        }
        
        .english-title {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 8px 20px;
            background: linear-gradient(90deg, transparent, rgba(212, 185, 150, 0.2), transparent);
            display: inline-block;
            border-radius: 20px;
        }
        
        .official-text {
            font-size: 14px;
            color: var(--light-brown);
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 5px 15px;
            background: rgba(212, 185, 150, 0.1);
            border-radius: 10px;
            display: inline-block;
        }
        
        .section-divider {
            display: flex;
            align-items: center;
            margin: 30px 0 20px;
            color: var(--primary);
        }
        
        .divider-line {
            flex-grow: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--light-brown), transparent);
        }
        
        .divider-text {
            padding: 0 15px;
            font-size: 14px;
            font-weight: 600;
            color: var(--dark-brown);
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .link-item {
            background: linear-gradient(135deg, rgba(255, 248, 240, 0.9), rgba(245, 241, 235, 0.9));
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--dark-brown);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(212, 185, 150, 0.3);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(139, 107, 79, 0.1);
        }
        
        .link-item:hover {
            transform: translateY(-5px) scale(1.02);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(245, 241, 235, 0.95));
            box-shadow: 
                0 15px 30px rgba(107, 79, 61, 0.2),
                0 0 0 2px rgba(167, 139, 111, 0.3);
            border-color: var(--light-brown);
        }
        
        .link-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 20px;
            font-size: 28px;
            background: linear-gradient(135deg, var(--cream), var(--light-brown));
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 185, 150, 0.5);
            box-shadow: 0 5px 15px rgba(139, 107, 79, 0.2);
        }
        
        .link-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0.5;
        }
        
        .link-icon.instagram { color: #E4405F; }
        .link-icon.snapchat { color: #000000; background: linear-gradient(135deg, #FFFC00, #FFFC00); }
        .link-icon.tiktok { color: #000000; background: linear-gradient(135deg, #69C9D0, #EE1D52); }
        
        .link-text {
            flex-grow: 1;
            text-align: right;
        }
        
        .link-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--dark-brown);
        }
        
        .link-subtitle {
            font-size: 14px;
            color: var(--primary);
            font-weight: 500;
        }
        
        .bottom-text {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid rgba(212, 185, 150, 0.3);
            color: var(--dark-brown);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .social-footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(212, 185, 150, 0.2);
        }
        
        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--cream), var(--light-brown));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-brown);
            font-size: 20px;
            transition: all 0.3s ease;
            border: 1px solid rgba(212, 185, 150, 0.3);
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(139, 107, 79, 0.2);
        }
        
        .social-icon:hover {
            transform: translateY(-5px) rotate(5deg);
            background: linear-gradient(135deg, var(--light-brown), var(--primary));
            box-shadow: 0 10px 20px rgba(107, 79, 61, 0.3);
            color: white;
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: var(--light-brown);
            padding: 0 20px;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        
        /* بۆ مۆبایل */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                height: auto;
                min-height: 100vh;
            }
            
            .container {
                max-width: 100%;
                padding: 10px;
            }
            
            .profile-card {
                padding: 25px 20px;
                border-radius: 25px;
            }
            
            .profile-pic-container {
                width: 110px;
                height: 110px;
            }
            
            .profile-pic {
                font-size: 42px;
            }
            
            .profile-name {
                font-size: 28px;
            }
            
            .link-item {
                padding: 18px;
            }
            
            .link-icon {
                width: 50px;
                height: 50px;
                font-size: 24px;
                margin-left: 15px;
            }
        }
        
        /* بۆ شاشە گەورەکان */
        @media (min-height: 800px) {
            .wrapper {
                padding: 40px 0;
            }
        }
    </style>
</head>
<body>
    <div class="cream-particles"></div>
    
    <div class="wrapper">
        <div class="container">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-pic-container">
                        <div class="profile-pic">
                            <i class="fas fa-crown" style="color: var(--dark-brown);"></i>
                        </div>
                    </div>
                    
                    <h1 class="profile-name">باسۆ</h1>
                    <div class="english-title">BASSO - OFFICIAL PAGES</div>
                    <p class="official-text">ئەکاونتی فەرمی باسۆ</p>
                </div>
                
                <div class="section-divider">
                    <div class="divider-line"></div>
                    <div class="divider-text">پەیوەندییەکان</div>
                    <div class="divider-line"></div>
                </div>
                
                <div class="links-container">
                    <a href="https://www.instagram.com/b4soo0?igsh=cjRraGl2ODQxd3o3&utm_source=qr" target="_blank" class="link-item">
                        <div class="link-icon instagram">
                            <i class="fab fa-instagram"></i>
                        </div>
                        <div class="link-text">
                            <div class="link-title">ئیستاگرام</div>
                            <div class="link-subtitle">@b4soo0</div>
                        </div>
                    </a>
                    
                    <a href="https://www.tiktok.com/@baasso9_?_r=1&_t=ZS-92etn1Uff0i" target="_blank" class="link-item">
                        <div class="link-icon tiktok">
                            <i class="fab fa-tiktok"></i>
                        </div>
                        <div class="link-text">
                            <div class="link-title">تیکتۆک</div>
                            <div class="link-subtitle">@baasso9_</div>
                        </div>
                    </a>
                    
                    <a href="https://snapchat.com/t/N3WqbMNQ" target="_blank" class="link-item">
                        <div class="link-icon snapchat">
                            <i class="fab fa-snapchat-ghost"></i>
                        </div>
                        <div class="link-text">
                            <div class="link-title">سناپچات</div>
                            <div class="link-subtitle">بیبینە لە سناپچات</div>
                        </div>
                    </a>
                </div>
                
                <div class="bottom-text">
                    ئەکاونتی فەرمی باسۆ
                </div>
                
                <div class="social-footer">
                    <a href="https://www.instagram.com/b4soo0?igsh=cjRraGl2ODQxd3o3&utm_source=qr" target="_blank" class="social-icon">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.tiktok.com/@baasso9_?_r=1&_t=ZS-92etn1Uff0i" target="_blank" class="social-icon">
                        <i class="fab fa-tiktok"></i>
                    </a>
                    <a href="https://snapchat.com/t/N3WqbMNQ" target="_blank" class="social-icon">
                        <i class="fab fa-snapchat-ghost"></i>
                    </a>
                </div>
            </div>
            
            <div class="footer">
                <p>© 2024 باسۆ | هەموو مافەکان پارێزراون</p>
                <p style="margin-top: 8px; font-size: 11px;">Official Basso Accounts - پەیوەندییە فەرمییەکان</p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // دروستکردنی پارتیکڵەکان
            function createParticles() {
                const particlesContainer = document.querySelector('.cream-particles');
                for (let i = 0; i < 30; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    
                    const size = Math.random() * 10 + 5;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    
                    particle.style.left = `${Math.random() * 100}%`;
                    particle.style.top = `${Math.random() * 100 + 100}%`;
                    
                    const duration = Math.random() * 20 + 10;
                    particle.style.animationDuration = `${duration}s`;
                    particle.style.animationDelay = `${Math.random() * 5}s`;
                    
                    particlesContainer.appendChild(particle);
                }
            }
            
            createParticles();
            
            // کاریگەرییەکانی لینکەکان
            const links = document.querySelectorAll('.link-item');
            links.forEach(link => {
                link.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-6px) scale(1.03)';
                });
                
                link.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
            
            // کاریگەریی کلیک
            document.addEventListener('click', function(e) {
                const clickEffect = document.createElement('div');
                clickEffect.style.position = 'fixed';
                clickEffect.style.width = '20px';
                clickEffect.style.height = '20px';
                clickEffect.style.borderRadius = '50%';
                clickEffect.style.background = 'radial-gradient(circle, var(--light-brown), transparent)';
                clickEffect.style.pointerEvents = 'none';
                clickEffect.style.left = `${e.clientX - 10}px`;
                clickEffect.style.top = `${e.clientY - 10}px`;
                clickEffect.style.zIndex = '9999';
                clickEffect.style.opacity = '0.7';
                
                document.body.appendChild(clickEffect);
                
                clickEffect.animate([
                    { transform: 'scale(1)', opacity: 0.7 },
                    { transform: 'scale(3)', opacity: 0 }
                ], {
                    duration: 500,
                    easing: 'ease-out'
                });
                
                setTimeout(() => {
                    if (clickEffect.parentNode) {
                        clickEffect.parentNode.removeChild(clickEffect);
                    }
                }, 500);
            });
            
            // دڵنیابوون لە جوڵاوی پەڕە
            document.body.style.overflow = 'auto';
            document.documentElement.style.overflow = 'auto';
        });
    </script>
</body>
</html>
